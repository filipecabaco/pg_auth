# Two panes and nothing else: no status bar, titled borders, mouse to switch panes. The active
# pane shows in its title; borders stay one grey (tmux colours only half of a shared border).
set -g status off
set -g mouse on
set -g escape-time 25
set -g default-terminal "tmux-256color"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#3ecf8e bold],#[fg=#8a8a8a]}#{pane_title}"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#3a3a3a"
set -g pane-border-lines heavy

# The docs page drives the panes with these: alt-1 anne, alt-2 bob; alt-v stacks the panes (a
# phone), alt-h puts them side by side
bind -n M-1 select-pane -t 0
bind -n M-2 select-pane -t 1
bind -n M-v select-layout even-vertical
bind -n M-h select-layout even-horizontal
