# compare/complex.exs: the acme tenant hides flagged expenses from everyone, finance included
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: expense
  scope: acme
  rules:
    - actions: ["view"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.status == "flagged"
