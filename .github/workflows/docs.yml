name: Deploy docs

# The site is MkDocs Material (mkdocs.yml, docs/, overrides/) plus the in-browser demo: a snowglobe
# build of docker/demo, which boots Postgres with pg_auth, the three engines and their sidecars on
# an emulated arm64 machine in the visitor's tab. The demo is content-addressed blobs, so the site
# ships as a Pages artifact rather than as commits, where every rebuilt snapshot would stay in
# history. Needs Settings → Pages → Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "docker/**"
      - "src/**"
      - "sql/**"
      - "sidecar/query/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # the version mise.toml pins
  SNOWGLOBE_VERSION: 0.2.0

jobs:
  build:
    # snowglobe guests are arm64; an arm64 runner builds the extension natively instead of under
    # QEMU, which for a pgrx build is the difference between minutes and an hour
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install "mkdocs>=1.6,<2" mkdocs-material

      - name: Install snowglobe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${SNOWGLOBE_VERSION}" -R filipecabaco/snowglobe \
            -p "snowglobe_${SNOWGLOBE_VERSION}_linux_arm64.tar.gz" -p SHA256SUMS -D "$RUNNER_TEMP/snowglobe"
          cd "$RUNNER_TEMP/snowglobe"
          grep "linux_arm64.tar.gz" SHA256SUMS | sha256sum -c -
          tar -xzf "snowglobe_${SNOWGLOBE_VERSION}_linux_arm64.tar.gz"
          sudo install "$(find . -type f -name snowglobe | head -1)" /usr/local/bin/snowglobe
          snowglobe --version

      - name: Build pg_auth and the sidecar for Alpine (arm64)
        run: docker build -f docker/alpine/Dockerfile -t pg_auth:alpine-arm64 .

      - name: Build the in-browser demo
        run: snowglobe build docker/demo --out docs/demo

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
