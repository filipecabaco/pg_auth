site_name: pg_auth
site_description: Your app's permissions, enforced by Postgres, with no backend. An authorization engine (OpenFGA, SpiceDB, Cerbos or Cedar) holds the rules; Postgres shows each user only their rows, and access is granted by writing a row. Live demo in the browser.
site_url: https://filipecabaco.github.io/pg_auth/
repo_url: https://github.com/filipecabaco/pg_auth
repo_name: filipecabaco/pg_auth
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Filipe Cabaço

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/supabase.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/demo.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/filipecabaco/pg_auth
    - icon: simple/supabase
      link: https://supabase.com

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: usage.md
  - Guides:
      - Mappings: guides/mappings.md
      - Migrations: guides/migrations.md
      - Debugging: guides/debugging.md
  - Benchmarks: benchmarks.md
  - Implementation: design.md
# kept in the repository, not on the site
exclude_docs: |
  research/
  proposals/
  performance.md
  testing.md
  development.md
