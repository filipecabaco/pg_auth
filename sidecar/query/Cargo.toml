[package]
name = "pg-auth-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Answers pg_auth's authorization questions from an external engine (OpenFGA, SpiceDB, Cerbos) over a local Unix socket"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hmac = "0.13"
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cerbos policies kept in Postgres are YAML; its Admin API takes JSON (a maintained serde_yaml fork)
serde_norway = "0.9"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-postgres = "0.7.18"
tokio-rustls = "0.26"
# the public roots, for PG_AUTH_DATABASE_URL's sslmode=verify-ca or verify-full without sslrootcert
webpki-roots = "1"

[profile.release]
lto = "fat"
codegen-units = 1

# release code with symbols, for profilers (docs/development.md)
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# prose names settings, engines and protocol fields freely
doc_markdown = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[dev-dependencies]
wiremock = "0.6.5"
